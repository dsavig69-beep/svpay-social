<!doctype html><html><head><meta charset="utf-8"><style>
/* Nov 12, 2026 rewrite 2: 5 slides, 5400x1350 CSS px, cut into bg_1..bg_5.png. Blue and violet only (no pink);

.top{position:absolute;left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0))}
</style></head><body>
